<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖片轉 PDF — PDF 工具箱</title>
<link rel="stylesheet" href="../assets/css/design.css">
<script src="../vendor/jszip.min.js"></script>
</head>
<body data-title-key="images.title">
<div data-wizard>
  <ol class="stepper" data-stepper data-i18n-label="wizard.steps">
    <li class="step active" data-step-number="1" aria-current="step"><span class="num">1</span><span data-i18n="wizard.upload"></span></li>
    <li class="step" data-step-number="2"><span class="num">2</span><span data-i18n="images.stepName"></span></li>
    <li class="step" data-step-number="3"><span class="num">3</span><span data-i18n="wizard.download"></span></li>
  </ol>
  <main class="wrap workspace">
    <section data-step="1" class="upload-panel" aria-labelledby="upload-title">
      <div class="page-heading"><div><p class="eyebrow" data-i18n="images.title"></p><h1 id="upload-title" tabindex="-1" data-i18n="wizard.uploadTitle"></h1><p data-i18n="images.uploadHint"></p></div></div>
      <div id="drop" class="dropzone" data-i18n="common.dropImages"></div>
      <p class="hint" data-i18n="images.heicHint"></p>
      <div data-file-list-slot="1"></div>
      <div class="action-bar"><button type="button" class="btn" data-wizard-action="adjust" data-continue hidden data-i18n="wizard.continue"></button></div>
    </section>
    <section data-step="2" hidden aria-labelledby="settings-title">
      <div class="page-heading"><div><p class="eyebrow" data-i18n="images.title"></p><h1 id="settings-title" tabindex="-1" data-i18n="images.heading"></h1><p data-i18n="images.intro"></p></div><span class="step-counter" data-i18n="wizard.stepCount" data-i18n-vars='{"n":2}'></span></div>
      <div class="workspace-grid">
        <div>
          <div class="files-toolbar"><strong data-i18n="wizard.selectedFiles"></strong><button type="button" class="text-btn" data-wizard-action="add" data-i18n="wizard.addMore"></button></div>
          <div data-file-list-slot="2"><ul id="filelist" class="filelist"></ul></div>
          <div class="card tool-options">
    <label data-i18n="images.orient"></label>
    <div class="radio-row">
      <label><input type="radio" name="orient" value="auto" checked><span data-i18n="images.auto"></span></label>
      <label><input type="radio" name="orient" value="portrait"><span data-i18n="images.portrait"></span></label>
      <label><input type="radio" name="orient" value="landscape"><span data-i18n="images.landscape"></span></label>
    </div>


          </div>
        </div>
        <aside data-i18n-label="images.summaryTitle"><div class="side-panel">
          <h3 data-i18n="images.summaryTitle"></h3>
          <div class="summary-item"><span data-i18n="wizard.selectedFiles"></span><strong data-summary-count></strong></div>
          <div class="summary-item"><span data-i18n="wizard.summaryImages"></span><strong data-summary-pages aria-live="polite"></strong></div>
          <div class="summary-item"><span data-i18n="wizard.summaryKept"></span><strong data-summary-output-pages aria-live="polite"></strong></div>
          <div class="summary-item"><span data-i18n="wizard.summarySize"></span><strong data-summary-size></strong></div>
          <div class="divider"></div><p class="explain" data-i18n="wizard.singleOutputHint"></p>
        </div></aside>
      </div>
      <div class="action-bar"><button type="button" class="back-link" data-wizard-action="upload"><span aria-hidden="true">←</span><span data-i18n="wizard.backUpload"></span></button><button type="button" id="run" class="btn" disabled><span data-i18n="images.run"></span><span aria-hidden="true">→</span></button></div>
    </section>
    <section data-step="3" hidden aria-label="PDF">
      <div data-completion></div>
      <div class="complete-actions"><button type="button" class="back-link" data-wizard-action="adjust"><span aria-hidden="true">←</span><span data-i18n="wizard.backAdjust"></span></button><button type="button" class="text-btn" data-wizard-action="restart" data-i18n="images.restart"></button></div>
    </section>
    <div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
  </main>
</div>
<script type="module">
import { mountTool, yieldToUI } from '../assets/core/toolpage.mjs';
import { newPdf, save, embedImage, AppError } from '../assets/core/pdf.mjs';
import { A4, fitInto } from '../assets/core/paging.mjs';
import { sanitizeFileName } from '../assets/core/naming.mjs';
import { t } from '../assets/core/i18n.mjs';
import { createToolSummary } from '../assets/core/tool-summary.mjs';

const updateSummary = createToolSummary(document.querySelector('[data-wizard]'), { images: true });

const MARGIN = 20;   // pt，四邊留白

await mountTool({
  dropEl: document.getElementById('drop'),
  listEl: document.getElementById('filelist'),
  runBtn: document.getElementById('run'),
  msgEl:  document.getElementById('msg'),
  accept: 'image', multiple: true, sortable: true,
  onFilesChange: updateSummary,
  wizard: { currentTool: 'images-to-pdf', step2Key: 'images.stepName', completeTitleKey: 'images.readyTitle', defaultNameKey: 'images.outNameDefault' },
  async run(files, ctx) {
    const orient = document.querySelector('input[name=orient]:checked').value;
    const doc = await newPdf();
    for (let i = 0; i < files.length; i++) {
      // 幾十張相入面邊一張出事，一定要話俾用戶知係邊個檔案——同 merge.html
      // 對住多檔案嗰陣嘅做法一致：一張壞相唔應該淨係話「處理失敗」就中斷
      // 成個批次，等用戶要一張張試先知邊張唔得。
      let img;
      try {
        img = await embedImage(doc, files[i]);
      } catch (e) {
        const reason = e instanceof AppError ? t(e.i18nKey, e.vars) : String(e && e.message || e);
        throw new AppError('error.imageFileFailed', { name: files[i].name, reason });
      }
      const landscape = orient === 'landscape'
        || (orient === 'auto' && img.width > img.height);
      const pw = landscape ? A4.H : A4.W;
      const ph = landscape ? A4.W : A4.H;
      const page = doc.addPage([pw, ph]);
      const fit = fitInto({
        srcW: img.width, srcH: img.height,
        boxW: pw - MARGIN * 2, boxH: ph - MARGIN * 2,
      });
      page.drawImage(img, {
        x: MARGIN + fit.x, y: MARGIN + fit.y, width: fit.w, height: fit.h,
      });
      ctx.progress(i + 1, files.length);
      await yieldToUI(); // 逐張就俾瀏覽器 repaint 一次，進度條先會逐步畫得出（唔係一路凍結到尾先跳去 done）
    }
    const raw = t('images.outNameDefault');
    const base = sanitizeFileName(raw.replace(/\.pdf$/i, ''), t('common.untitled'));
    return [{ name: `${base}.pdf`, bytes: await save(doc) }];
  },
});

</script>
</body>
</html>
