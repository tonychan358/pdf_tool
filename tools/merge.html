<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#164b40">
<title>合併 — PDF 工具箱</title>
<link rel="stylesheet" href="../assets/css/design.css">
<script src="../vendor/jszip.min.js"></script>
</head>
<body data-title-key="merge.title">
<div data-wizard>
  <ol class="stepper" data-stepper data-i18n-label="wizard.steps">
    <li class="step active" data-step-number="1" aria-current="step"><span class="num">1</span><span data-i18n="wizard.upload"></span></li>
    <li class="step" data-step-number="2"><span class="num">2</span><span data-i18n="merge.stepName"></span></li>
    <li class="step" data-step-number="3"><span class="num">3</span><span data-i18n="wizard.download"></span></li>
  </ol>
  <main class="wrap workspace">
    <section data-step="1" class="upload-panel" aria-labelledby="upload-title">
      <div class="page-heading"><div><p class="eyebrow" data-i18n="hub.merge"></p>
        <h1 id="upload-title" tabindex="-1" data-i18n="wizard.uploadTitle"></h1><p data-i18n="wizard.uploadHint"></p></div></div>
      <div id="drop" class="dropzone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg><span data-i18n="common.dropPdf"></span></div>
      <div data-file-list-slot="1"></div>
      <div class="action-bar"><button type="button" class="btn" data-wizard-action="adjust" data-continue hidden data-i18n="wizard.continue"></button></div>
    </section>
    <section data-step="2" hidden aria-labelledby="sort-title">
      <div class="page-heading"><div><p class="eyebrow" data-i18n="hub.merge"></p>
        <h1 id="sort-title" tabindex="-1" data-i18n="merge.heading"></h1><p data-i18n="merge.intro"></p></div><span class="step-counter" data-i18n="wizard.stepCount" data-i18n-vars='{"n":2}'></span></div>
      <div class="workspace-grid">
        <div><div class="files-toolbar"><div><strong id="file-count"></strong><span> · <span id="file-total"></span></span></div><button type="button" class="text-btn" data-wizard-action="add"><span aria-hidden="true">＋</span><span data-i18n="wizard.addMore"></span></button></div>
          <div data-file-list-slot="2"><ul id="filelist" class="filelist"></ul></div>
          <p class="list-hint" data-i18n="merge.hint"></p></div>
        <aside data-i18n-label="merge.summaryTitle"><div class="side-panel">
          <h3 data-i18n="merge.summaryTitle"></h3>
          <div class="summary-item"><span data-i18n="merge.summaryCountLabel"></span><strong id="summary-count"></strong></div>
          <div class="summary-item"><span data-i18n="merge.summaryPages"></span><strong id="summary-pages" aria-live="polite"></strong></div>
          <div class="summary-item"><span data-i18n="merge.summarySize"></span><strong id="summary-size"></strong></div>
          <div class="divider"></div><div class="flow-mini" aria-hidden="true"><span class="mini-sheet">1</span><span class="mini-sheet">2</span><span class="mini-sheet">3</span><svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg><span class="mini-sheet mini-stack">PDF</span></div>
          <p class="explain" data-i18n="merge.summaryHint"></p></div>
          <div class="callout"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span data-i18n="merge.localHint"></span></div></aside>
      </div>
      <div class="action-bar"><button type="button" class="back-link" data-wizard-action="upload"><span aria-hidden="true">←</span><span data-i18n="wizard.backUpload"></span></button>
        <div><button type="button" id="run" class="btn" disabled><span data-i18n="merge.run"></span><span aria-hidden="true">→</span></button><p class="action-caption" data-i18n="merge.nextCaption"></p></div></div>
    </section>
    <section data-step="3" hidden aria-label="PDF">
      <div data-completion></div>
      <div class="complete-actions"><button type="button" class="back-link" data-wizard-action="adjust"><span aria-hidden="true">←</span><span data-i18n="wizard.backAdjust"></span></button>
        <button type="button" class="text-btn" data-wizard-action="restart" data-i18n="merge.restart"></button></div>
    </section>
    <div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
  </main>
</div>
<script type="module">
import { mountTool, yieldToUI } from '../assets/core/toolpage.mjs';
import { loadPdf, newPdf, copyRange, save, AppError } from '../assets/core/pdf.mjs';
import { sanitizeFileName, formatSize } from '../assets/core/naming.mjs';
import { getPageCount, summarizeFiles } from '../assets/core/filemeta.mjs';
import { t } from '../assets/core/i18n.mjs';

const $ = id => document.getElementById(id);
let selectedFiles = [], summaryGeneration = 0;
const localized = (id, key, vars = {}) => {
  const el = $(id);
  el.dataset.i18n = key;
  el.dataset.i18nVars = JSON.stringify(vars);
  el.textContent = t(key, vars);
};
function updateSummary(files) {
  selectedFiles = files;
  const generation = ++summaryGeneration;
  const summary = summarizeFiles(files, []);
  localized('file-count', 'wizard.fileCount', { n: summary.count });
  localized('summary-count', 'merge.summaryCount', { n: summary.count });
  $('file-total').textContent = $('summary-size').textContent = formatSize(summary.bytes);
  localized('summary-pages', files.length ? 'wizard.pagesPending' : 'wizard.pages', { n: 0 });
  Promise.all(files.map(getPageCount)).then(counts => {
    // 舊清單的非同步頁數不能寫回使用者已更改的選擇。
    if (generation !== summaryGeneration) return;
    const { pages } = summarizeFiles(files, counts);
    localized('summary-pages', pages === null ? 'wizard.pagesUnknown' : 'wizard.pages', { n: pages });
  });
}

await mountTool({
  dropEl: $('drop'), listEl: $('filelist'), runBtn: $('run'), msgEl: $('msg'),
  accept: 'pdf', multiple: true, sortable: true,
  onFilesChange: updateSummary,
  wizard: {
    step2Key: 'merge.stepName', completeTitleKey: 'merge.readyTitle', resultLabelKey: 'merge.resultLabel',
    defaultNameKey: 'merge.outNameDefault',
    completeSummary: () => ({ key: 'merge.readySummary', vars: { n: selectedFiles.length } }),
  },
  async run(files, ctx) {
    const out = await newPdf();
    for (let i = 0; i < files.length; i++) {
      // 幾個檔案入面邊一個先出事，一定要話俾用戶知——單單話「處理失敗」佢哋
      // 會唔知去邊個檔案入手，尤其係一次過拖咗好多份入嚟嘅時候。呢個 try 一
      // 定要連 copyRange／getPageCount 都包埋：試過有啲損壞檔 pdf-lib 喺
      // loadPdf() 嗰陣唔會拋錯（鬆散咁「讀到」一個殘缺嘅 PDFDocument），到
      // 真正攞 Pages／複製頁面先爆——如果淨係包 loadPdf，呢種情況會漏網，
      // 使用者見到嘅就係冇檔名嘅 error.generic。
      try {
        const src = await loadPdf(files[i]);
        await copyRange(src, out, 1, src.getPageCount());
      } catch (e) {
        const reason = e instanceof AppError ? { i18nKey: e.i18nKey, vars: e.vars } : String(e && e.message || e);
        throw new AppError('error.mergeFileFailed', { name: files[i].name, reason });
      }
      ctx.progress(i + 1, files.length);
      await yieldToUI(); // 逐檔就俾瀏覽器 repaint 一次，進度條先會逐步畫得出（唔係一路凍結到尾先跳去 done）
    }
    const raw = t('merge.outNameDefault');
    const base = sanitizeFileName(raw.replace(/\.pdf$/i, ''), t('common.untitled'));
    return [{ name: `${base}.pdf`, bytes: await save(out), pages: out.getPageCount() }];
  },
});
</script>
</body>
</html>
