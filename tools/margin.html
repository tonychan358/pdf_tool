<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>批改留白 — PDF 工具箱</title>
<link rel="stylesheet" href="../assets/css/design.css">
<script src="../vendor/jszip.min.js"></script>
</head>
<body data-title-key="margin.title">
<div data-wizard>
  <ol class="stepper" data-stepper data-i18n-label="wizard.steps">
    <li class="step active" data-step-number="1" aria-current="step"><span class="num">1</span><span data-i18n="wizard.upload"></span></li>
    <li class="step" data-step-number="2"><span class="num">2</span><span data-i18n="margin.stepName"></span></li>
    <li class="step" data-step-number="3"><span class="num">3</span><span data-i18n="wizard.download"></span></li>
  </ol>
  <main class="wrap workspace">
    <section data-step="1" class="upload-panel" aria-labelledby="upload-title">
      <div class="page-heading"><div><p class="eyebrow" data-i18n="margin.title"></p><h1 id="upload-title" tabindex="-1" data-i18n="wizard.uploadTitle"></h1><p data-i18n="wizard.uploadHint"></p></div></div>
      <div id="drop" class="dropzone" data-i18n="common.dropPdf"></div>

      <div data-file-list-slot="1"></div>
      <div class="action-bar"><button type="button" class="btn" data-wizard-action="adjust" data-continue hidden data-i18n="wizard.continue"></button></div>
    </section>
    <section data-step="2" hidden aria-labelledby="settings-title">
      <div class="page-heading"><div><p class="eyebrow" data-i18n="margin.title"></p><h1 id="settings-title" tabindex="-1" data-i18n="margin.heading"></h1><p data-i18n="margin.intro"></p></div><span class="step-counter" data-i18n="wizard.stepCount" data-i18n-vars='{"n":2}'></span></div>
      <div class="workspace-grid">
        <div>
          <div class="files-toolbar"><strong data-i18n="wizard.selectedFiles"></strong><button type="button" class="text-btn" data-wizard-action="upload" data-i18n="wizard.changeFile"></button></div>
          <div data-file-list-slot="2"><ul id="filelist" class="filelist"></ul></div>
          <div class="card tool-options">
    <label data-i18n="margin.edge"></label>
    <div class="radio-row">
      <label><input type="radio" name="edge" value="right" checked><span data-i18n="margin.right"></span></label>
      <label><input type="radio" name="edge" value="bottom"><span data-i18n="margin.bottom"></span></label>
    </div>
    <p class="hint" data-i18n="margin.rotateNote"></p>

    <label for="size" data-i18n="margin.size"></label>
    <input type="number" id="size" value="40" min="1" step="1">
    <p class="hint" data-i18n="margin.sizeHint"></p>


          </div>
        </div>
        <aside data-i18n-label="margin.summaryTitle"><div class="side-panel">
          <h3 data-i18n="margin.summaryTitle"></h3>
          <div class="summary-item"><span data-i18n="wizard.selectedFiles"></span><strong data-summary-count></strong></div>
          <div class="summary-item"><span data-i18n="wizard.summaryPages"></span><strong data-summary-pages aria-live="polite"></strong></div>
          <div class="summary-item"><span data-i18n="wizard.summaryKept"></span><strong data-summary-output-pages aria-live="polite"></strong></div>
          <div class="summary-item"><span data-i18n="wizard.summarySize"></span><strong data-summary-size></strong></div>
          <div class="divider"></div><p class="explain" data-i18n="wizard.singleOutputHint"></p>
        </div></aside>
      </div>
      <div class="action-bar"><button type="button" class="back-link" data-wizard-action="upload"><span aria-hidden="true">←</span><span data-i18n="wizard.backUpload"></span></button><button type="button" id="run" class="btn" disabled><span data-i18n="margin.run"></span><span aria-hidden="true">→</span></button></div>
    </section>
    <section data-step="3" hidden aria-label="PDF">
      <div data-completion></div>
      <div class="complete-actions"><button type="button" class="back-link" data-wizard-action="adjust"><span aria-hidden="true">←</span><span data-i18n="wizard.backAdjust"></span></button><button type="button" class="text-btn" data-wizard-action="restart" data-i18n="margin.restart"></button></div>
    </section>
    <div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
  </main>
</div>
<script type="module">
import { mountTool, yieldToUI } from '../assets/core/toolpage.mjs';
import { loadPdf, newPdf, save } from '../assets/core/pdf.mjs';
import { marginEdge } from '../assets/core/paging.mjs';
import { sanitizeFileName } from '../assets/core/naming.mjs';
import { t } from '../assets/core/i18n.mjs';
import { createToolSummary } from '../assets/core/tool-summary.mjs';

const updateSummary = createToolSummary(document.querySelector('[data-wizard]'), {});

const $ = id => document.getElementById(id);
const sizeEl = $('size');

const MM_TO_PT = 72 / 25.4;

// 留白闊度上下限（毫米）。落閘：0 或負數留白冇意義（甚至會令新版嘅
// newW/newH 跌到 ≤ 0，addPage 直接拋錯）。上閘：呢個工具唔似 nup 嘅
// gutter 咁會令內容「爆格」——加大 pad 純粹令新版更大，內容本身唔會被
// 裁走或變形。但一個冇上限嘅留白（例如打錯多咗個 0）會靜靜雞產出一份
// 「開得到、頁數啱，但版面比例離晒譜、印出嚟大半頁係空白」嘅檔案，用戶
// 未必即刻發現。200mm 已經比 A4 闊邊（297mm）短，但遠超一般評語欄所需
// （預設 40mm），留返呢個做上限，超出就夾住並提示。
const MIN_MARGIN_MM = 1;
const MAX_MARGIN_MM = 200;
sizeEl.max = String(MAX_MARGIN_MM);

// 用戶打嘅留白闊度一旦超出上下限，就即時夾返落嚟並彈警告——喺 change
// 事件度做（用戶離開個欄嗰刻），而唔係擺喺 run() 入面先做：處理完成後會
// 切去下載畫面，用戶未必見到自己打嘅數字已經被夾過。擺喺
// 呢度、喺撳「開始處理」之前就令用戶睇到，先真正符合「唔可以靜靜雞俾佢
// 哋一個唔係佢哋所要求嘅結果」呢個要求。
function clampSizeInput() {
  const raw = Number(sizeEl.value);
  if (!Number.isFinite(raw) || raw < MIN_MARGIN_MM) {
    sizeEl.value = String(MIN_MARGIN_MM);
    ctrl.showWarn('margin.sizeClampedMin', { min: MIN_MARGIN_MM });
  } else if (raw > MAX_MARGIN_MM) {
    sizeEl.value = String(MAX_MARGIN_MM);
    ctrl.showWarn('margin.sizeClampedMax', { max: MAX_MARGIN_MM });
  }
}

const ctrl = await mountTool({
  dropEl: $('drop'),
  listEl: $('filelist'),
  runBtn: $('run'),
  msgEl:  $('msg'),
  accept: 'pdf', multiple: false,
  onFilesChange: updateSummary,
  wizard: { currentTool: 'margin', step2Key: 'margin.stepName', completeTitleKey: 'margin.readyTitle', defaultNameKey: 'margin.outNameDefault' },
  async run(files, ctx) {
    const visualEdge = document.querySelector('input[name=edge]:checked').value;
    // 撳「開始處理」嗰刻先再夾多一次做保底：正常情況下 clampSizeInput() 已經
    // 喺 change 事件（例如撳呢粒掣之前嘅 blur）度做咗，呢度嘅
    // Math.min(Math.max(...)) 純粹係防禦性網——確保就算個 input 唔知點解仲
    // 揸住一個超出範圍嘅值（例如用戶冇離開過個欄，直接靠 Enter/滑鼠撳掣），
    // 都唔會餵一個會令 newW/newH ≤ 0 或者離晒譜嘅 pad 落去落面嘅迴圈。
    const sizeMm = Math.min(Math.max(MIN_MARGIN_MM, Number(sizeEl.value) || MIN_MARGIN_MM), MAX_MARGIN_MM);
    const pad = sizeMm * MM_TO_PT;

    const src = await loadPdf(files[0]);
    const total = src.getPageCount();
    const out = await newPdf();

    for (let i = 0; i < total; i++) {
      const srcPage = src.getPage(i);
      const rotation = srcPage.getRotation().angle;
      // marginEdge answers in mediabox terms（即係轉之前嘅本地座標），同
      // embedPage／getSize 用緊嘅座標系一致——PDFPageEmbedder 只係用
      // MediaBox 起手（唔理 /Rotate），所以「加邊」同「推內容」呢兩步都
      // 要喺呢個未轉嘅本地座標度做，先可以配合最尾 setRotation() 保留返
      // 用戶原本睇到嘅方向。
      const edge = marginEdge(visualEdge, rotation);
      const { width: w, height: h } = srcPage.getSize();

      const grow = { right: [pad, 0], left: [pad, 0], top: [0, pad], bottom: [0, pad] }[edge];
      const newW = w + grow[0];
      const newH = h + grow[1];

      // 內容要擺喺「唔加白」嗰邊：加白喺 left/bottom 時，個新版係向住原點
      // 嗰邊撐大，內容如果唔推開就會同新加嘅留白疊埋一齊（相當於留白畫咗
      // 喺內容上面），所以要推 pad 咁遠。加白喺 right/top 時新版係向住遠離
      // 原點嗰邊撐大，內容留喺 (0,0) 原位就啱。
      const offsetX = edge === 'left' ? pad : 0;
      const offsetY = edge === 'bottom' ? pad : 0;

      const embedded = await out.embedPage(srcPage);
      const page = out.addPage([newW, newH]);
      page.drawPage(embedded, { x: offsetX, y: offsetY, xScale: 1, yScale: 1 });
      // 保留原本嘅 /Rotate，等呢個未轉嘅本地座標喺顯示時經返同一個旋轉，
      // 令用戶睇到嘅方向、以及留白落喺嘅視覺邊，都同轉之前一致。
      page.setRotation(srcPage.getRotation());

      ctx.progress(i + 1, total);
      await yieldToUI(); // 逐頁就俾瀏覽器 repaint 一次，進度條先會逐步畫得出（唔係一路凍結到尾先跳去 done）
    }

    const raw = t('margin.outNameDefault');
    const base = sanitizeFileName(raw.replace(/\.pdf$/i, ''), t('common.untitled'));
    return [{ name: `${base}.pdf`, bytes: await save(out) }];
  },
});

// 呢個監聽器要喺 ctrl 已經賦值之後先掛（clampSizeInput() 入面用到
// ctrl.showWarn()）——mountTool() 嗰個 await 期間，用戶理論上都有機會撳嘢，
// 太早掛就有機會撞落 ctrl 仲喺 TDZ 嘅窗口。
sizeEl.addEventListener('change', clampSizeInput);

</script>
</body>
</html>
