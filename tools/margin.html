<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>批改留白 — PDF 工具箱</title>
<link rel="stylesheet" href="../assets/css/design.css">
<script src="../vendor/jszip.min.js"></script>
</head>
<body data-title-key="margin.title">
<div class="wrap">
  <header class="site">
    <h1 data-i18n="margin.title"></h1>
    <div>
      <a href="../index.html" data-i18n="app.backToHub"></a>
      <button id="lang-toggle" class="secondary" style="margin:0 0 0 1rem;padding:.4rem .8rem" data-i18n="app.langToggle"></button>
    </div>
  </header>
  <p class="privacy" data-i18n="app.privacy"></p>

  <div class="card">
    <div id="drop" class="dropzone" data-i18n="common.dropPdf"></div>
    <ul id="filelist" class="filelist"></ul>

    <label data-i18n="margin.edge"></label>
    <div class="radio-row">
      <label><input type="radio" name="edge" value="right" checked><span data-i18n="margin.right"></span></label>
      <label><input type="radio" name="edge" value="bottom"><span data-i18n="margin.bottom"></span></label>
    </div>
    <p class="hint" data-i18n="margin.rotateNote"></p>

    <label data-i18n="margin.size"></label>
    <input type="number" id="size" value="40" min="1" step="1">
    <p class="hint" data-i18n="margin.sizeHint"></p>

    <label data-i18n="margin.outName"></label>
    <input type="text" id="outName">

    <button id="run" class="primary" data-i18n="common.run"></button>
    <div id="msg" class="msg" hidden></div>
  </div>
</div>

<script type="module">
import { mountTool, yieldToUI } from '../assets/core/toolpage.mjs';
import { loadPdf, newPdf, save } from '../assets/core/pdf.mjs';
import { marginEdge } from '../assets/core/paging.mjs';
import { sanitizeFileName } from '../assets/core/naming.mjs';
import { t } from '../assets/core/i18n.mjs';

const $ = id => document.getElementById(id);
const outNameEl = $('outName');
const sizeEl = $('size');

const MM_TO_PT = 72 / 25.4;

// 留白闊度上下限（毫米）。落閘：0 或負數留白冇意義（甚至會令新版嘅
// newW/newH 跌到 ≤ 0，addPage 直接拋錯）。上閘：呢個工具唔似 nup 嘅
// gutter 咁會令內容「爆格」——加大 pad 純粹令新版更大，內容本身唔會被
// 裁走或變形。但一個冇上限嘅留白（例如打錯多咗個 0）會靜靜雞產出一份
// 「開得到、頁數啱，但版面比例離晒譜、印出嚟大半頁係空白」嘅檔案，用戶
// 未必即刻發現。200mm 已經比 A4 闊邊（297mm）短，但遠超一般評語欄所需
// （預設 40mm），留返呢個做上限，超出就夾住並提示。
const MIN_MARGIN_MM = 1;
const MAX_MARGIN_MM = 200;
sizeEl.max = String(MAX_MARGIN_MM);

// 用戶打嘅留白闊度一旦超出上下限，就即時夾返落嚟並彈警告——喺 change
// 事件度做（用戶離開個欄嗰刻），而唔係擺喺 run() 入面先做：mountTool 嘅
// click handler 喺 run() 完成、deliver() 完成之後一定會執行
// ctrl.showOk('common.done')，會將 run() 入面設嘅任何訊息（包括呢個警告）
// 即刻蓋走，用戶淨係會見到「完成」，唔會見到自己打嘅數字已經被夾過。擺喺
// 呢度、喺撳「開始處理」之前就令用戶睇到，先真正符合「唔可以靜靜雞俾佢
// 哋一個唔係佢哋所要求嘅結果」呢個要求。
function clampSizeInput() {
  const raw = Number(sizeEl.value);
  if (!Number.isFinite(raw) || raw < MIN_MARGIN_MM) {
    sizeEl.value = String(MIN_MARGIN_MM);
    ctrl.showWarn('margin.sizeClampedMin', { min: MIN_MARGIN_MM });
  } else if (raw > MAX_MARGIN_MM) {
    sizeEl.value = String(MAX_MARGIN_MM);
    ctrl.showWarn('margin.sizeClampedMax', { max: MAX_MARGIN_MM });
  }
}

const ctrl = await mountTool({
  dropEl: $('drop'),
  listEl: $('filelist'),
  runBtn: $('run'),
  msgEl:  $('msg'),
  accept: 'pdf', multiple: false,
  async run(files, ctx) {
    const visualEdge = document.querySelector('input[name=edge]:checked').value;
    // 撳「開始處理」嗰刻先再夾多一次做保底：正常情況下 clampSizeInput() 已經
    // 喺 change 事件（例如撳呢粒掣之前嘅 blur）度做咗，呢度嘅
    // Math.min(Math.max(...)) 純粹係防禦性網——確保就算個 input 唔知點解仲
    // 揸住一個超出範圍嘅值（例如用戶冇離開過個欄，直接靠 Enter/滑鼠撳掣），
    // 都唔會餵一個會令 newW/newH ≤ 0 或者離晒譜嘅 pad 落去落面嘅迴圈。
    const sizeMm = Math.min(Math.max(MIN_MARGIN_MM, Number(sizeEl.value) || MIN_MARGIN_MM), MAX_MARGIN_MM);
    const pad = sizeMm * MM_TO_PT;

    const src = await loadPdf(files[0]);
    const total = src.getPageCount();
    const out = await newPdf();

    for (let i = 0; i < total; i++) {
      const srcPage = src.getPage(i);
      const rotation = srcPage.getRotation().angle;
      // marginEdge answers in mediabox terms（即係轉之前嘅本地座標），同
      // embedPage／getSize 用緊嘅座標系一致——PDFPageEmbedder 只係用
      // MediaBox 起手（唔理 /Rotate），所以「加邊」同「推內容」呢兩步都
      // 要喺呢個未轉嘅本地座標度做，先可以配合最尾 setRotation() 保留返
      // 用戶原本睇到嘅方向。
      const edge = marginEdge(visualEdge, rotation);
      const { width: w, height: h } = srcPage.getSize();

      const grow = { right: [pad, 0], left: [pad, 0], top: [0, pad], bottom: [0, pad] }[edge];
      const newW = w + grow[0];
      const newH = h + grow[1];

      // 內容要擺喺「唔加白」嗰邊：加白喺 left/bottom 時，個新版係向住原點
      // 嗰邊撐大，內容如果唔推開就會同新加嘅留白疊埋一齊（相當於留白畫咗
      // 喺內容上面），所以要推 pad 咁遠。加白喺 right/top 時新版係向住遠離
      // 原點嗰邊撐大，內容留喺 (0,0) 原位就啱。
      const offsetX = edge === 'left' ? pad : 0;
      const offsetY = edge === 'bottom' ? pad : 0;

      const embedded = await out.embedPage(srcPage);
      const page = out.addPage([newW, newH]);
      page.drawPage(embedded, { x: offsetX, y: offsetY, xScale: 1, yScale: 1 });
      // 保留原本嘅 /Rotate，等呢個未轉嘅本地座標喺顯示時經返同一個旋轉，
      // 令用戶睇到嘅方向、以及留白落喺嘅視覺邊，都同轉之前一致。
      page.setRotation(srcPage.getRotation());

      ctx.progress(i + 1, total);
      await yieldToUI(); // 逐頁就俾瀏覽器 repaint 一次，進度條先會逐步畫得出（唔係一路凍結到尾先跳去 done）
    }

    const raw = outNameEl.value.trim() || t('margin.outNameDefault');
    const base = sanitizeFileName(raw.replace(/\.pdf$/i, ''), t('common.untitled'));
    return [{ name: `${base}.pdf`, bytes: await save(out) }];
  },
});

// 呢個監聽器要喺 ctrl 已經賦值之後先掛（clampSizeInput() 入面用到
// ctrl.showWarn()）——mountTool() 嗰個 await 期間，用戶理論上都有機會撳嘢，
// 太早掛就有機會撞落 ctrl 仲喺 TDZ 嘅窗口。
sizeEl.addEventListener('change', clampSizeInput);

// 預設檔名要跟返介面語言，同 merge.html／nup.html 等其他工具用同一套
// 做法：初次載入用 mountTool() 入面 initI18n() 揀好嘅語言即刻填一次；
// 之後用戶撳 lang-toggle 切換語言，都要即時跟住換一次——否則介面已經切晒
// 去英文，輸出檔名仍然係中文「批改留白結果.pdf」，同其餘所有文字唔一致。
// 但一旦用戶自己打過檔名，呢個自動同步就要停手，唔可以蓋走佢哋打緊/打好
// 嘅嘢——用 outNameTouched 記住「用戶有冇手動改過」。
// apply()（i18n.mjs）每次語言載入完成都會改 <html lang="...">，用嚟做
// 「呢輪語言切換真係完成咗」嘅訊號，好過喺 click handler 度即刻讀 t()（嗰
// 陣新字典仲未 fetch 完，會讀到舊語言）。
let outNameTouched = false;
outNameEl.addEventListener('input', () => { outNameTouched = true; });
const applyDefaultOutName = () => {
  if (!outNameTouched) outNameEl.value = `${t('margin.outNameDefault')}.pdf`;
};
applyDefaultOutName();
new MutationObserver(applyDefaultOutName)
  .observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
</script>
</body>
</html>
